<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>QuizMaster PWA - Evaluador Interactivo</title>

  <!-- PWA & SEO Meta Tags -->
  <meta name="description" content="Aplicación de evaluación interactiva mobile-first con soporte offline y diseño táctil moderno.">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QuizMaster">

  <!-- Icons and Manifest -->
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="manifest" href="manifest.json">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand-info">
        <img src="icons/icon-192.svg" alt="QuizMaster Logo" class="brand-logo" width="36" height="36">
        <h1 class="brand-title">QuizMaster</h1>
      </div>

      <div class="header-actions">
        <!-- Install PWA Button (Shown when browser allows install) -->
        <button id="btnInstall" class="btn-install" aria-label="Instalar aplicación en tu celular">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Instalar
        </button>

        <!-- Network Connectivity Status Indicator -->
        <div id="networkStatus" class="status-badge" title="Estado de la conexión">
          <span class="status-dot"></span>
          <span id="networkText">En línea</span>
        </div>
      </div>
    </header>

    <!-- Quiz Main View -->
    <main id="quizSection" class="quiz-main">
      <!-- Progress Section -->
      <section class="progress-card" aria-label="Progreso de la evaluación">
        <div class="progress-header">
          <span class="progress-label">Evaluación PWA</span>
          <div id="progressCounter" class="progress-counter">
            Pregunta <strong id="currentQuestionNum">1</strong> <span>de</span> <strong id="totalQuestionsNum">5</strong>
          </div>
        </div>
        <div class="progress-track" role="progressbar" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100">
          <div id="progressBar" class="progress-bar" style="width: 20%;"></div>
        </div>
      </section>

      <!-- Question Card -->
      <section class="question-card" aria-live="polite">
        <div id="questionCategory" class="question-category">Tecnología Web</div>
        <h2 id="questionTitle" class="question-title">Cargando pregunta...</h2>
      </section>

      <!-- Answer Options (Rendered dynamically as large touch cards) -->
      <div id="optionsList" class="options-list" role="radiogroup" aria-label="Opciones de respuesta">
        <!-- Options injected dynamically by app.js -->
      </div>

      <!-- Navigation Bar (Sticky Bottom Controls) -->
      <nav class="navigation-bar" aria-label="Navegación del examen">
        <button id="btnPrev" class="btn-nav btn-prev" disabled aria-label="Pregunta anterior">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Anterior
        </button>

        <button id="btnNext" class="btn-nav btn-next" aria-label="Pregunta siguiente">
          Siguiente
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>

        <button id="btnFinish" class="btn-nav btn-finish" aria-label="Finalizar examen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          Finalizar Examen
        </button>
      </nav>
    </main>

    <!-- Results / Summary View -->
    <section id="resultsSection" class="results-view" aria-hidden="true">
      <div class="results-card">
        <div class="results-icon-wrap" aria-hidden="true">🎯</div>
        <h2 id="resultsTitle" class="results-title">¡Examen Finalizado!</h2>
        <p id="resultsSubtitle" class="results-subtitle">Has completado todas las preguntas de la prueba.</p>

        <div class="score-badge-wrap">
          <div id="scorePercent" class="score-number">0%</div>
          <div id="scoreFraction" class="score-scale">0 de 0 preguntas correctas</div>
        </div>

        <div class="stats-grid">
          <div class="stat-item">
            <div id="statCorrect" class="stat-val correct">0</div>
            <div class="stat-label">Correctas</div>
          </div>
          <div class="stat-item">
            <div id="statIncorrect" class="stat-val incorrect">0</div>
            <div class="stat-label">Incorrectas</div>
          </div>
          <div class="stat-item">
            <div id="statAccuracy" class="stat-val">0%</div>
            <div class="stat-label">Precisión</div>
          </div>
          <div class="stat-item">
            <div id="statStatus" class="stat-val">Aprobado</div>
            <div class="stat-label">Resultado</div>
          </div>
        </div>
      </div>

      <button id="btnRestart" class="btn-restart" aria-label="Reiniciar evaluación">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </svg>
        Reintentar Examen
      </button>
    </section>

    <!-- Floating Toast Notification -->
    <aside id="toastContainer" class="toast-container" aria-live="polite">
      <div id="toastMessage" class="toast">
        <span id="toastText"></span>
      </div>
    </aside>
  </div>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
